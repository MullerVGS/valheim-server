services:
  valheim:
    # Imagem lloesche/valheim-server-docker (Apache-2.0). Nao contem o jogo:
    # e Debian + SteamCMD, e o servidor (app 896660) baixa no 1o boot pro volume.
    # Dentro dela roda um supervisord com 5 processos (crond, bootstrap,
    # updater, backup, server) — nao e um processo so.
    #
    # Tag pinada de proposito: `latest` em servico com estado migra sozinho.
    # Atualizar = trocar a sha aqui, conscientemente.
    image: ghcr.io/lloesche/valheim-server:sha-a134fb4dc7a8
    container_name: valheim
    restart: unless-stopped

    # Valheim SO salva o mundo em SIGINT. O entrypoint manda SIGINT e espera;
    # se o Docker matar antes, perde tudo desde o ultimo autosave.
    # Este grace period e o que da tempo do save terminar.
    stop_grace_period: 2m

    # O servidor ajusta prioridade de thread no boot. Sem isso, log de erro.
    cap_add:
      - SYS_NICE

    # Teto de RAM: o jogo cresce com o mundo. Protege o resto do host.
    mem_limit: ${MEM_LIMIT:-4g}

    ports:
      # jogo + query. A 2a porta e sempre SERVER_PORT+1: se mudar uma, mude a outra.
      - "${SERVER_PORT:-2456}:${SERVER_PORT:-2456}/udp"
      - "${SERVER_QUERY_PORT:-2457}:${SERVER_QUERY_PORT:-2457}/udp"
      # a imagem tambem expoe 80/tcp (status) e 9001/tcp (supervisord).
      # nao publicamos: nao tem auth.

    environment:
      SERVER_NAME: ${SERVER_NAME}
      WORLD_NAME: ${WORLD_NAME}
      SERVER_PASS: ${SERVER_PASS}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-0}
      SERVER_PORT: ${SERVER_PORT:-2456}
      ADMINLIST_IDS: ${ADMINLIST_IDS:-}
      PERMITTEDLIST_IDS: ${PERMITTEDLIST_IDS:-}
      TZ: ${TZ:-America/Sao_Paulo}

      # Argumentos extras do servidor dedicado. E por aqui que entram os World
      # Modifiers (`-modifier <chave> <valor>`, `-preset`, `-resetmodifiers`):
      # eles valem para mundo ja existente e nao tocam o progresso, porque o load
      # so limpa as chaves de modificador, nao as de boss derrotado.
      # Tirar o argumento NAO reverte -- a chave fica gravada no mundo.
      SERVER_ARGS: ${SERVER_ARGS:-}

      # Backup: zipa os mundos e poda os velhos. Roda ANTES do update,
      # pra existir um save da versao anterior se a nova quebrar algo.
      BACKUPS: "true"
      BACKUPS_CRON: ${BACKUPS_CRON:-0 7 * * *}
      BACKUPS_MAX_AGE: "7"

      # Update: cliente Steam atualiza sozinho e versao diferente nao conecta,
      # entao ficar parado tambem quebra. Horario morto porque reinicia o servidor.
      UPDATE_CRON: ${UPDATE_CRON:-0 8 * * *}

      # Restart diario: so roda se ninguem estiver conectado (valheim-is-idle).
      # Mesmo default da imagem; escolha um horario em que o servidor costuma estar vazio.
      RESTART_CRON: ${RESTART_CRON:-10 5 * * *}

      # BepInEx, so para carregar o plugin de metricas (plugin/). Opt-in.
      # A imagem baixa o BepInExPack `latest` do Thunderstore no boot e em cada update.
      BEPINEX: ${BEPINEX:-false}
      # A imagem so copia /config/bepinex/plugins se a pasta de destino ja existir, e o zip
      # do BepInExPack nao traz BepInEx/plugins: toda reinstalacao (update do jogo, container
      # recriado) subia sem o plugin. O hook cria a pasta antes da copia. `$$` e o `$` literal;
      # `plugins_path` e a variavel da funcao da imagem que roda o hook.
      PRE_BEPINEX_CONFIG_HOOK: 'mkdir -p "$$plugins_path"'

      # Ajustes de rede do plugin (exigem BEPINEX=true). Vazio = o jogo como ele e.
      # O servidor manda ZDO a um jogador por frame, ate 10240 bytes por pacote: com N
      # jogadores, cada um recebe no maximo 10240 * FPS / (N+1) bytes/s, e o Steam corta
      # em 153600 bytes/s por conexao. FPS: 30..360 (o jogo fixa 30). Limite:
      # 10240..65536. Taxa do Steam: 153600..1048576.
      VALHEIM_SERVER_FPS: ${VALHEIM_SERVER_FPS:-}
      VALHEIM_ZDO_SEND_LIMIT_BYTES: ${VALHEIM_ZDO_SEND_LIMIT_BYTES:-}
      VALHEIM_STEAM_SEND_RATE_BYTES: ${VALHEIM_STEAM_SEND_RATE_BYTES:-}

      # Limpeza horaria de assets (trava 0,7-0,9 s para liberar quase nada): 1 = espera o servidor
      # esvaziar. Histerese de dono: on = peca so troca de dono quando sai do que o dono tem
      # carregado; measure = como o jogo, contando o que seria segurado. Vazio = jogo. Ver README.
      VALHEIM_DEFER_ASSET_UNLOAD: ${VALHEIM_DEFER_ASSET_UNLOAD:-}
      VALHEIM_OWNER_HYSTERESIS: ${VALHEIM_OWNER_HYSTERESIS:-}

      # Icones nas placas (exige BEPINEX=true). Caminho, dentro do container, do catalogo gerado
      # por tools/sign-icons. Vazio = placa como o jogo faz. Ver README.
      VALHEIM_SIGN_ICONS_CATALOG: ${VALHEIM_SIGN_ICONS_CATALOG:-}

      # Pagina de pedidos de entrada na whitelist (exige BEPINEX=true). Porta HTTP dentro do
      # container, sem login e sem publicar: so atras de proxy com autenticacao. Vazio = sem pagina;
      # aviso e /unban no jogo funcionam igual. Ver README.
      VALHEIM_ACCESS_PORT: ${VALHEIM_ACCESS_PORT:-}

      # Slots de bau reservados (exige BEPINEX=true): 1 = o servidor recoloca a pilha de zero no slot
      # marcado quando o bau fecha. Marcar exige o mod de cliente; o resto do grupo joga vanilla. Ver README.
      VALHEIM_SLOT_MARKS: ${VALHEIM_SLOT_MARKS:-}

      # Combustivel de fogo (exige BEPINEX=true): N = tochas, braseiros, fogueiras e lareiras gastam N
      # vezes menos (2..100), sem mod no cliente. Vazio = jogo. Ver README.
      VALHEIM_FIRE_FUEL_FACTOR: ${VALHEIM_FIRE_FUEL_FACTOR:-}

      # Mapa (exige BEPINEX=true): pasta, dentro do container, onde o plugin desenha os tiles do que as
      # mesas de cartografia mostram. Vazio = sem tiles; as metricas de posicao saem igual. Ver README.
      VALHEIM_MAP_DIR: ${VALHEIM_MAP_DIR:-}
      # Desenho diario dos tiles: horario, zoom maximo, fracao de nucleo e orcamento por frame. Vazio = padrao.
      VALHEIM_MAP_DRAW_AT: ${VALHEIM_MAP_DRAW_AT:-}
      VALHEIM_MAP_MAX_ZOOM: ${VALHEIM_MAP_MAX_ZOOM:-}
      VALHEIM_MAP_DRAW_DUTY: ${VALHEIM_MAP_DRAW_DUTY:-}
      VALHEIM_MAP_SCAN_BUDGET_MS: ${VALHEIM_MAP_SCAN_BUDGET_MS:-}

    volumes:
      # config = mundos, listas, backups. E o que importa.
      - config:/config
      # server = binarios baixados do Steam. Descartavel, rebaixa sozinho.
      - server:/opt/valheim

  # Compila o plugin de metricas contra o servidor instalado no volume (os binarios do
  # jogo nao vao pro repo) e grava a DLL em /config/bepinex/plugins. Precisa de um boot
  # com BEPINEX=true antes, pra existir o BepInEx no volume:
  #   docker compose --profile plugin run --rm plugin-build
  plugin-build:
    image: mcr.microsoft.com/dotnet/sdk:8.0.425
    profiles: [plugin]
    working_dir: /src/src
    command: sh -c 'dotnet build -c Release -o /tmp/out && install -D -m 644 /tmp/out/ValheimMetrics.dll /config/bepinex/plugins/ValheimMetrics.dll'
    volumes:
      - ./plugin:/src
      - server:/opt/valheim:ro
      - config:/config

volumes:
  config:
  server:
